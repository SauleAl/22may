<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 май</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: linear-gradient(to bottom, #000000, #000428);
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, white, transparent),
                radial-gradient(1px 1px at 30% 40%, white, transparent),
                radial-gradient(1px 1px at 50% 10%, white, transparent),
                radial-gradient(1px 1px at 70% 30%, white, transparent),
                radial-gradient(1px 1px at 90% 50%, white, transparent),
                radial-gradient(1px 1px at 20% 60%, white, transparent),
                radial-gradient(1px 1px at 40% 80%, white, transparent),
                radial-gradient(1px 1px at 60% 90%, white, transparent),
                radial-gradient(1px 1px at 80% 70%, white, transparent),
                radial-gradient(1px 1px at 15% 85%, white, transparent),
                radial-gradient(1px 1px at 5% 15%, white, transparent),
                radial-gradient(1px 1px at 25% 35%, white, transparent),
                radial-gradient(1px 1px at 45% 55%, white, transparent),
                radial-gradient(1px 1px at 65% 75%, white, transparent),
                radial-gradient(1px 1px at 85% 95%, white, transparent),
                radial-gradient(1px 1px at 35% 25%, white, transparent),
                radial-gradient(1px 1px at 55% 45%, white, transparent),
                radial-gradient(1px 1px at 75% 65%, white, transparent),
                radial-gradient(1px 1px at 95% 5%, white, transparent),
                radial-gradient(1px 1px at 12% 72%, white, transparent);
            pointer-events: none;
        }
        .flip-card {
            background-color: transparent;
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        .flipped {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .flip-card-front {
            background-color: #FFB6D9;
            color: black;
        }
        .flip-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .flip-card-back {
            background-color: #003d82;
            color: white;
            transform: rotateY(180deg);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            font-size: 18px;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .flip-card-back::-webkit-scrollbar {
            width: 12px;
        }
        .flip-card-back::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .flip-card-back::-webkit-scrollbar-thumb {
            background: #FFB6D9;
            border-radius: 6px;
        }
        .flip-card-back::-webkit-scrollbar-thumb:hover {
            background: #FFA0C9;
        }
        .flip-card-back p {
            margin: 0;
            text-align: justify;
            line-height: 1.6;
            color: white;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        .password-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .password-section input, .password-section button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>С седьмой годовщиной частичка моего сердца!</h1>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="Callisto_Voyager2Gill_960.jpg" alt="Фото 1">
            </div>
            <div class="flip-card-back">
                <div class="password-section">
                    <p>Введите пароль:</p>
                    <input type="password" id="pass1">
                    <button onclick="checkPassword(0)">Ввести</button>
                </div>
            </div>
        </div>
    </div>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="SATURN2025-11-20-1130.jpg" alt="Фото 2">
            </div>
            <div class="flip-card-back">
                <div class="password-section">
                    <p>Введите пароль:</p>
                    <input type="password" id="pass2">
                    <button onclick="checkPassword(1)">Ввести</button>
                </div>
            </div>
        </div>
    </div>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="RosetteCalcagno1082.jpg" alt="Фото 3">
            </div>
            <div class="flip-card-back">
                <div class="password-section">
                    <p>Введите пароль:</p>
                    <input type="password" id="pass3">
                    <button onclick="checkPassword(2)">Ввести</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const passwords = ['01.09.2025', '22.11.2025', '14.02.2026'];
        document.querySelectorAll('.flip-card').forEach((card, index) => {
            card.addEventListener('click', function() {
                if (this.querySelector('.flip-card-inner').classList.contains('flipped')) return;
                this.querySelector('.flip-card-inner').classList.add('flipped');
            });
        });
        function checkPassword(index) {
            let pass = document.getElementById('pass' + (index + 1)).value;
            if (pass === passwords[index]) {
                let back = document.querySelectorAll('.flip-card-back')[index];
                back.style.backgroundColor = '#003d82';
                let descriptions = [
                    '<p>Перед поступлением в универ я сильно волновалась, смогу ли я влиться в новую компанию и как пройдет адаптация в новом городе. В первый день, когда у нас была конференция с БК и нас всех вынудили включить камеры, я заметила, что где-то на фоне сидит одна маленькая и щупленькая девочка. И тогда я испытала очень странное чувство — мое сердце сделало сальто назад с кувырком. Я поняла, что вот она — та самая! И с тех пор я ждала, чтобы закончился онлайн, а потом и ты изволила прийти спустя неделю, чтобы приступить к своему плану по завоеванию меня. Вроде, как-то сработало, не знаю точно. Я очень кринжую сейчас от собственных слов, потому что не знаю, как красиво подвести информацию, которую я и так всегда говорю. Но каждый раз ты либо сама кринжуешь, либо не веришь мне. А мне не сложно повторить это хоть тысячу раз, как и не сложно показывать и рассказывать всему миру, что я тебя люблю. Спасибо, что ты есть у меня, милая!</p>',
                    '<p>На самом деле тогда в ноябре я еще не знала до конца, как себя вести с тобой (говорю так будто бы сейчас знаю). Мне постоянно казалось, что я глупо шучу или вообще не умею (до сих пор так думаю), и когда ты в очередной раз сказала, что так-то мы знакомы не так давно, я уточнила, что уже около двух месяцев. Тогда ты сказала (как мне показалось очень грубо): «Ну давай тогда еще и отмечать начнем каждый месяц». Я посмеялась и не стала говорить, что я просто пошутила, чтобы не разрушать те малейшие взаимоотношения, зарождавшиеся тогда. В тот день был сильный дождь и переполненные автобусы. Я помню, что, притворившись целый день, что все хорошо, я села в автобус жить свою, как я тогда думала, грустную жизнь, и я была очень удивлена, когда увидела, что ты прислала мне тот подарочек в телеге. Ты и правда была единственной, из-за кого мне хотелось просыпаться по утрам. Не знаю, так ли тебе важно в принципе каждый месяц как-то вспоминать эту случайно появившуюся дату, но я надеюсь, что со временем тебе это не надоест, потому что я очень люблю такие мини-традиции, как и люблю тебя. Спасибо, что ты есть у меня, родная!</p>',
                    '<p>В тот день в январе, когда я предложила тебе отметить 14 февраля вместе, я думала, ты отшутишься и откажешь, либо скажешь, что ты как всегда будешь с Рахимом и откажешь напрямую. Поэтому я до самого конца переживала, что ты сольешься в последний момент. Но мне было очень приятно, когда ты согласилась, и мы провели тогда практически весь этот дождливый день вместе. А еще мне было приятно от того, что ты приняла цветы от меня, сохранила лепесточки и даже поставила себе на обои (пока это не стала бухающая лошадь    :( ). Тогда я подумала, что нужно почаще куда-то с тобой ходить, но и заставлять тебя не хотелось. В общем, сегодня 13 мая 2026 года, пишу тебе первое, что приходит в голову (у меня сильное головокружение, возможно, от успокоительных), но я не могла забросить всё, пока не реализую и пока голова еще работает. Я не знаю, увидимся ли мы летом, так как живем в разных городах и, скорее всего, ты чаще будешь с Рахой, но я все равно буду скучать по тебе так же, как и скучаю сейчас. С любовью к тебе, твоя С. Спасибо, что ты есть у меня, частичка души моей!</p>'
                ];
                back.innerHTML = descriptions[index];
            } else {
                alert('Неверный пароль!');
            }
        }
    </script>
</body>
</html>
